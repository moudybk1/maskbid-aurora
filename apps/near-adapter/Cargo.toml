[package]
name = "maskbid-near-adapter"
version = "0.1.0"
edition = "2021"
publish = false
description = "MaskBid NEAR adapter: authenticated Aurora XCC requests -> pinned OutLayer solver -> Aurora callback"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
