[package]
name = "maskbid-private-solver"
version = "0.1.0"
edition = "2021"
publish = false
description = "MaskBid v1 private solver for OutLayer (wasm32-wasip2): INIT_KEY seals a per-auction RSA key in the TEE, SOLVE ranks the complete bid set"

[lib]
path = "src/lib.rs"

[[bin]]
name = "maskbid-private-solver"
path = "src/main.rs"

[features]
default = []
# Evidence-only build (G-02 negatives): same code, manifest without the `callers` gate and no pinned-adapter check,
# so any account can run it and show that another build/caller cannot open the production sealed blob.
probe = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
sha3 = { version = "0.10", default-features = false }
aes-gcm = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
num-bigint-dig = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.36"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
