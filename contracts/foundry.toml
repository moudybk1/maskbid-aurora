[profile.default]
src = "src"
out = "out"
# Solidity libraries come from npm (root package.json), so `npm install` is the only setup step.
libs = ["../node_modules"]
allow_paths = ["../node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
lint = { lint_on_build = false }
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "../packages/protocol/vectors" },
]
remappings = [
    "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
    "forge-std/=../node_modules/forge-std/src/",
]
