[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
lint = { lint_on_build = false }
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "../packages/protocol/vectors" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
