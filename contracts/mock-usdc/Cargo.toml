[package]
name = "mock-usdc"
version = "0.1.0"
edition = "2021"
publish = false
description = "Testnet-only 6-decimal NEP-141 payment token with a faucet. Not real money."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
